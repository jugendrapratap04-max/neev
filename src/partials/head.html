<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F3ED">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<!-- The font is the first thing the page needs and the last thing the CSS
     mentions, so tell the browser about it up front. -->
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/neev.css">
<meta property="og:site_name" content="{{ brand }} — {{ brandFull }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">
<!-- The link gets pasted into WhatsApp all day; this is the card people see.
     og:image must be an absolute URL, so it follows CONFIG.siteUrl. -->
<meta property="og:image" content="{{ siteUrl }}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ brand }} — websites for small businesses, live in 3 days">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ siteUrl }}/og-image.png">
