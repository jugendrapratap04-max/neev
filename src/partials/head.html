<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F3ED">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/neev.css">
<meta property="og:site_name" content="{{ brand }} — {{ brandFull }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">
<!-- The link gets pasted into WhatsApp all day; this is the card people see.
     og:image must be an absolute URL, so it follows CONFIG.siteUrl. -->
<meta property="og:image" content="{{ siteUrl }}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ brand }} — websites for small businesses, live in 3 days">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ siteUrl }}/og-image.png">
