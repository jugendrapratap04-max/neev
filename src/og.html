<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Rendered at exactly 1200x630 by scripts/og.mjs. This is the card that
     appears whenever the link is pasted into WhatsApp, which is the whole
     funnel — so it carries the offer, not just the logo. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #F6F3ED; color: #18202B;
    font-family: Inter, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px;
    position: relative;
  }
  .top { display: flex; align-items: baseline; gap: 14px; }
  .mark { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { font-size: 18px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #45474b; }
  h1 { font-size: 76px; line-height: 1.06; font-weight: 700; letter-spacing: -0.025em; max-width: 15ch; }
  h1 .blue { color: #0051d5; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .facts { display: flex; gap: 44px; }
  .fact .k { font-size: 15px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #75777c; }
  .fact .v { font-size: 34px; font-weight: 700; margin-top: 6px; letter-spacing: -0.01em; }
  .phone {
    display: inline-flex; align-items: center; gap: 12px;
    background: #020812; color: #fff; border-radius: 999px;
    padding: 16px 28px; font-size: 24px; font-weight: 600;
  }
  .dot { width: 12px; height: 12px; border-radius: 999px; background: #25D366; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #0051d5; }
</style>
</head>
<body>
  <div class="top">
    <span class="mark">NEEV</span>
    <span class="sub">web studio · Mathura</span>
  </div>

  <h1>Your shop deserves its own website. <span class="blue">Live in 3 days.</span></h1>

  <div class="row">
    <div class="facts">
      <div class="fact"><div class="k">From</div><div class="v">₹1,999</div></div>
      <div class="fact"><div class="k">Monthly fee</div><div class="v">₹0</div></div>
      <div class="fact"><div class="k">Demo first</div><div class="v">Free</div></div>
    </div>
    <span class="phone"><span class="dot"></span>+91 84393 05810</span>
  </div>

  <div class="rule"></div>
</body>
</html>
